name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
      - name: Analyze & test
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Build macOS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
        run: |
          flutter build macos --release --no-tree-shake-icons \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --dart-define=CLOUDINARY_CLOUD_NAME=$CLOUDINARY_CLOUD_NAME \
            --dart-define=CLOUDINARY_UPLOAD_PRESET=$CLOUDINARY_UPLOAD_PRESET
      - name: Create DMG
        env:
          SKIP_FLUTTER_BUILD: "1"
        run: chmod +x scripts/build_macos_dmg.sh && ./scripts/build_macos_dmg.sh
      - name: Build iOS (unsigned IPA for SideStore)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
        run: |
          flutter build ios --release --no-codesign --no-tree-shake-icons \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --dart-define=CLOUDINARY_CLOUD_NAME=$CLOUDINARY_CLOUD_NAME \
            --dart-define=CLOUDINARY_UPLOAD_PRESET=$CLOUDINARY_UPLOAD_PRESET
          chmod +x scripts/package_unsigned_ipa.sh
          ./scripts/package_unsigned_ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: iris-dp-macos-dmg
          path: build/dmg/IRIS-DP.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: iris-dp-ios-ipa
          path: build/ios/ipa/IRIS-DP.ipa

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
      - name: Build Windows
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
        run: |
          flutter build windows --release --no-tree-shake-icons `
            --dart-define=SUPABASE_URL=$env:SUPABASE_URL `
            --dart-define=SUPABASE_ANON_KEY=$env:SUPABASE_ANON_KEY `
            --dart-define=CLOUDINARY_CLOUD_NAME=$env:CLOUDINARY_CLOUD_NAME `
            --dart-define=CLOUDINARY_UPLOAD_PRESET=$env:CLOUDINARY_UPLOAD_PRESET
      - uses: actions/upload-artifact@v4
        with:
          name: iris-dp-windows
          path: build/windows/x64/runner/Release/

  publish:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: iris-dp-macos-dmg
          path: artifacts/macos

      - uses: actions/download-artifact@v4
        with:
          name: iris-dp-windows
          path: artifacts/windows

      - uses: actions/download-artifact@v4
        with:
          name: iris-dp-ios-ipa
          path: artifacts/ios

      - name: Zip Windows build
        run: |
          cd artifacts/windows
          zip -r ../../IRIS-DP-Windows.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/macos/IRIS-DP.dmg
            IRIS-DP-Windows.zip
            artifacts/ios/IRIS-DP.ipa

      - name: Register release in Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          chmod +x scripts/register_app_release.sh
          NOTES=$(git tag -l --format='%(contents:subject)' "${{ github.ref_name }}" 2>/dev/null || true)
          EXTRA=()
          if [[ -n "$NOTES" ]]; then
            EXTRA=(--notes "$NOTES")
          fi
          ./scripts/register_app_release.sh \
            --tag "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            "${EXTRA[@]}"
