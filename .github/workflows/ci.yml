name: CI

on:
  # Todas las ramas: el trabajo vive semanas en ramas plan/* antes de main.
  push:
    branches: ['**']
  pull_request:

# Un push nuevo cancela el anterior de la misma rama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    # Sin esto, un paso colgado agota las 6 horas de GitHub.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # El código de Drift (app_database.g.dart) está en el repositorio:
      # regenerarlo aquí se colgaba siempre.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test
