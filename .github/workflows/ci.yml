name: CI

on:
  # Todas las ramas: el trabajo vive semanas en ramas plan/* antes de main.
  push:
    branches: ['**']
  pull_request:

# Un push nuevo cancela el anterior de la misma rama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    # Sin esto, un paso colgado agota las 6 horas de GitHub.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # El código de Drift (app_database.g.dart) está en el repositorio:
      # regenerarlo aquí se colgaba siempre.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

  # Compila la app de Windows para que una rotura se vea en el PR y no meses
  # después (estuvo rota desde v1.0.18 sin que se notara). Deja el zip para
  # probarlo en el PC sin esperar a un release.
  build-windows:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/plan/pc')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # El 3D (flutter_inappwebview) baja WebView2 con NuGet al compilar.
      - uses: nuget/setup-nuget@v2

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
        run: |
          flutter build windows --release --no-tree-shake-icons `
            --dart-define=SUPABASE_URL=$env:SUPABASE_URL `
            --dart-define=SUPABASE_ANON_KEY=$env:SUPABASE_ANON_KEY `
            --dart-define=CLOUDINARY_CLOUD_NAME=$env:CLOUDINARY_CLOUD_NAME `
            --dart-define=CLOUDINARY_UPLOAD_PRESET=$env:CLOUDINARY_UPLOAD_PRESET

      - uses: actions/upload-artifact@v4
        with:
          name: IRIS-DP-Windows-${{ github.sha }}
          path: build/windows/x64/runner/Release/
          retention-days: 14
