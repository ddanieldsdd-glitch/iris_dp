name: Supabase keepalive

# GitHub solo ejecuta cron desde la rama por defecto (main).
# Los cron se desactivan si el repo lleva ~60 días sin commits.
on:
  schedule:
    # Varias veces al día: Supabase pide “unas pocas queries de usuario cada día”.
    - cron: '0 6 * * *'
    - cron: '0 14 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/supabase_keepalive.yml'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Postgres via PostgREST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "Missing secret SUPABASE_URL"
            exit 1
          fi
          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing secret SUPABASE_ANON_KEY"
            exit 1
          fi
          BASE="${SUPABASE_URL%/}"
          # /auth/v1/health NO cuenta: no toca Postgres.
          # GET a una tabla sí: PostgREST ejecuta SQL (aunque RLS devuelva []).
          ping_table() {
            local table="$1"
            local url="${BASE}/rest/v1/${table}?select=*&limit=1"
            echo "GET $url"
            local code
            code=$(curl -sS --fail-with-body --retry 2 --retry-delay 2 \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              -H "Accept: application/json" \
              -H "Prefer: count=exact" \
              -o /tmp/supabase_keepalive.json \
              -w "%{http_code}" \
              "$url" || true)
            echo "HTTP $code"
            head -c 400 /tmp/supabase_keepalive.json || true
            echo
            if [ "$code" != "200" ]; then
              echo "REST ping failed for ${table} with status $code"
              return 1
            fi
          }
          ping_table app_releases
          ping_table profiles
          ping_table cloud_projects
          echo "Keepalive OK: Postgres received queries."
