name: Supabase keepalive

on:
  schedule:
    # Cada 3 días a las 06:00 UTC
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Auth health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "Missing secret SUPABASE_URL"
            exit 1
          fi
          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing secret SUPABASE_ANON_KEY"
            exit 1
          fi
          BASE="${SUPABASE_URL%/}"
          URL="${BASE}/auth/v1/health"
          echo "GET $URL"
          CODE=$(curl -sS \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -o /tmp/supabase_health.json \
            -w "%{http_code}" \
            "$URL")
          echo "HTTP $CODE"
          cat /tmp/supabase_health.json || true
          if [ "$CODE" != "200" ]; then
            echo "Health check failed with status $CODE"
            exit 1
          fi
