name: Página de invitación

# Publica web_invite/ en GitHub Pages: la página que abren los enlaces de
# invitación (lib/core/access/app_invite.dart, kInvitePageUrl).
on:
  push:
    branches: [main]
    paths: ['web_invite/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web_invite
      - id: deployment
        uses: actions/deploy-pages@v4
